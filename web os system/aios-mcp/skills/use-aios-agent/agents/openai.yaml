interface:
  display_name: "Use AIOS Agent"
  short_description: "Use, schedule, or archive approved AIOS employees"
  default_prompt: "Use $use-aios-agent to find one of my approved AIOS employees, run the right capability, request a governed schedule, or safely request archival."
dependencies:
  tools:
    - type: "mcp"
      value: "aios"
      description: "AIOS MCP server for account-scoped Agent runtime plus governed schedule and archival proposals"
      transport: "streamable_http"
      url: "https://aurion-aios-mcp.lazyoffice.app/mcp"
policy:
  allow_implicit_invocation: true
