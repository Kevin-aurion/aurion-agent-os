openapi: 3.1.0
info:
  title: AI OS Conversational Agent Builder API
  version: 0.1.0-draft
  description: >-
    Architecture-level API contract for teaching, validating, approving, publishing and running
    enterprise Agents. Langflow is hidden behind an Agent Runtime Adapter and is not the system of record.
servers:
  - url: https://aios.example.com
security:
  - bearerAuth: []
tags:
  - name: Agents
  - name: Teaching
  - name: Change Proposals
  - name: Skills
  - name: Runs
  - name: Approvals
  - name: Connectors
  - name: Capabilities
  - name: Evaluations
paths:
  /v1/agents:
    post:
      tags: [Agents]
      summary: Create an Agent
      operationId: createAgent
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateAgentRequest'}
      responses:
        '201': {description: Created, content: {application/json: {schema: {$ref: '#/components/schemas/Agent'}}}}
  /v1/agents/{agentId}:
    get:
      tags: [Agents]
      summary: Get the active Agent and its bound Skill versions
      parameters: [{$ref: '#/components/parameters/AgentId'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Agent'}}}}
  /v1/agents/{agentId}/teach:
    post:
      tags: [Teaching]
      summary: Convert a chat instruction into an immediate command or a governed change proposal
      parameters: [{$ref: '#/components/parameters/AgentId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TeachRequest'}
      responses:
        '202': {description: Accepted, content: {application/json: {schema: {$ref: '#/components/schemas/TeachResponse'}}}}
  /v1/change-proposals/{proposalId}:
    get:
      tags: [Change Proposals]
      summary: Get a proposal, diff, risk, test and estimated-cost results
      parameters: [{$ref: '#/components/parameters/ProposalId'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/ChangeProposal'}}}}
  /v1/change-proposals/{proposalId}/approve:
    post:
      tags: [Change Proposals]
      summary: Approve a change proposal for compilation and publication
      parameters: [{$ref: '#/components/parameters/ProposalId'}]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                comment: {type: string}
                publishMode: {enum: [manual, immediate, canary]}
      responses:
        '202': {description: Approval accepted}
  /v1/change-proposals/{proposalId}/reject:
    post:
      tags: [Change Proposals]
      summary: Reject a change proposal
      parameters: [{$ref: '#/components/parameters/ProposalId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties: {reason: {type: string}}
      responses:
        '200': {description: Rejected}
  /v1/skills/{skillId}/versions/{version}/publish:
    post:
      tags: [Skills]
      summary: Publish an immutable Skill version and bind its compiled artifact
      parameters:
        - {$ref: '#/components/parameters/SkillId'}
        - {$ref: '#/components/parameters/Version'}
      responses:
        '202': {description: Publication started}
  /v1/skills/{skillId}/rollback:
    post:
      tags: [Skills]
      summary: Roll back to a previously published Skill version
      parameters: [{$ref: '#/components/parameters/SkillId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetVersion]
              properties: {targetVersion: {type: string}}
      responses:
        '202': {description: Rollback started}
  /v1/agents/{agentId}/runs:
    post:
      tags: [Runs]
      summary: Run the active Agent version
      parameters: [{$ref: '#/components/parameters/AgentId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RunRequest'}
      responses:
        '202': {description: Run accepted, content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}}
  /v1/runs/{runId}:
    get:
      tags: [Runs]
      summary: Get run status and summary
      parameters: [{$ref: '#/components/parameters/RunId'}]
      responses:
        '200': {description: OK, content: {application/json: {schema: {$ref: '#/components/schemas/Run'}}}}
  /v1/runs/{runId}/events:
    get:
      tags: [Runs]
      summary: Stream normalized AI OS events independent of the underlying runtime
      parameters: [{$ref: '#/components/parameters/RunId'}]
      responses:
        '200':
          description: Server-Sent Events
          content:
            text/event-stream:
              schema: {type: string}
  /v1/approvals/{approvalId}/decision:
    post:
      tags: [Approvals]
      summary: Approve, reject or edit a suspended tool call and resume the run
      parameters:
        - name: approvalId
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: {enum: [approve, reject, edit]}
                editedArguments: {type: object}
                comment: {type: string}
      responses:
        '202': {description: Decision accepted and resume requested}
  /v1/connectors/{provider}/authorize:
    post:
      tags: [Connectors]
      summary: Start OAuth or delegated authorization; credentials are stored by reference
      parameters:
        - name: provider
          in: path
          required: true
          schema: {type: string}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                scopes: {type: array, items: {type: string}}
                redirectUri: {type: string, format: uri}
      responses:
        '200': {description: Authorization URL or completed binding}
  /v1/capabilities/search:
    get:
      tags: [Capabilities]
      summary: Search approved tools, MCP tools, Skills, flows and knowledge sources
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string}
        - name: type
          in: query
          schema: {enum: [tool, mcp, skill, flow, knowledge, connector]}
      responses:
        '200': {description: OK}
  /v1/evaluations/run:
    post:
      tags: [Evaluations]
      summary: Run static, policy, simulation, security, cost and latency evaluations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target]
              properties:
                target: {type: object}
                suites: {type: array, items: {type: string}}
      responses:
        '202': {description: Evaluation started}
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AgentId: {name: agentId, in: path, required: true, schema: {type: string}}
    ProposalId: {name: proposalId, in: path, required: true, schema: {type: string}}
    SkillId: {name: skillId, in: path, required: true, schema: {type: string}}
    Version: {name: version, in: path, required: true, schema: {type: string}}
    RunId: {name: runId, in: path, required: true, schema: {type: string}}
  schemas:
    CreateAgentRequest:
      type: object
      required: [name, role]
      properties:
        name: {type: string}
        role: {type: string}
        description: {type: string}
        defaultLanguage: {type: string, default: zh-TW}
        riskProfile: {enum: [low, medium, high]}
    Agent:
      type: object
      required: [id, name, status]
      properties:
        id: {type: string}
        name: {type: string}
        status: {enum: [draft, active, paused, archived]}
        activeVersion: {type: string}
        skillBindings: {type: array, items: {type: object}}
        runtimeBinding: {type: object}
    TeachRequest:
      type: object
      required: [conversationId, message]
      properties:
        conversationId: {type: string}
        message: {type: string}
        mode: {enum: [auto, command_only, propose_changes], default: auto}
        context: {type: object}
    TeachResponse:
      type: object
      required: [classification]
      properties:
        classification: {enum: [immediate_command, teaching, rule_change, schedule_change, knowledge_update, connector_request, clarification_required]}
        responseMessage: {type: string}
        proposalId: {type: string}
        commandRunId: {type: string}
        missingInformation: {type: array, items: {type: string}}
    ChangeProposal:
      type: object
      properties:
        id: {type: string}
        status: {enum: [draft, validating, pending_approval, approved, rejected, published, failed]}
        summary: {type: string}
        diff: {type: object}
        requestedPermissions: {type: array, items: {type: string}}
        risk: {type: object}
        evaluation: {type: object}
        estimatedCost: {type: object}
    RunRequest:
      type: object
      properties:
        input: {type: object}
        mode: {enum: [sync, stream, background], default: background}
        sessionId: {type: string}
        idempotencyKey: {type: string}
        dryRun: {type: boolean, default: false}
    Run:
      type: object
      properties:
        id: {type: string}
        status: {enum: [queued, running, suspended, succeeded, failed, cancelled]}
        agentVersion: {type: string}
        runtime: {type: string}
        startedAt: {type: string, format: date-time}
        completedAt: {type: string, format: date-time}
        result: {type: object}
        cost: {type: object}
        traceId: {type: string}
