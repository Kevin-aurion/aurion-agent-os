interface:
  display_name: "Use AIOS Agent"
  short_description: "Invoke approved AIOS employees and request governed schedules"
  default_prompt: "Use $use-aios-agent to find one of my approved AIOS employees, run the right capability, and report the verified result."
dependencies:
  tools:
    - type: "mcp"
      value: "aios"
      description: "AIOS MCP server for account-scoped Agent runtime and governed schedule proposals"
      transport: "streamable_http"
      url: "https://aios-mcp.lazyoffice.app/mcp"
policy:
  allow_implicit_invocation: true
