interface:
  display_name: "Use AIOS Agent"
  short_description: "Use, schedule, or archive active AIOS employees"
  default_prompt: "Use $use-aios-agent to find one of my active AIOS employees, run the right capability, manage its schedule, or archive it after exact-name confirmation."
dependencies:
  tools:
    - type: "mcp"
      value: "aurion_aios"
      description: "Hosted AIOS OAuth MCP for account-scoped Agent runtime, schedules, and archival"
      transport: "streamable_http"
      url: "https://aurion-aios-mcp.lazyoffice.app/mcp"
policy:
  allow_implicit_invocation: true
