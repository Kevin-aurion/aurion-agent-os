interface:
  display_name: "Build AIOS Agent"
  short_description: "Train and directly activate AIOS employees"
  default_prompt: "Use $build-aios-agent to route my request, interview me naturally, preserve one durable session per employee, and activate the finished AIOS employee."
dependencies:
  tools:
    - type: "mcp"
      value: "aurion_aios"
      description: "Hosted AIOS OAuth MCP for durable Builder synchronization, direct activation, and Agent runtime"
      transport: "streamable_http"
      url: "https://aurion-aios-mcp.lazyoffice.app/mcp"
policy:
  allow_implicit_invocation: true
