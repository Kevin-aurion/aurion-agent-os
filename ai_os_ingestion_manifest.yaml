questions_for_current_ai_os:
- 現有 Agent、Workflow、Tool、MCP、Knowledge、Credential、Tenant 與 Audit 模組分別在哪裡？
- 現有 Runtime 是否已有 Adapter/Provider abstraction？
- AI OS 的真實資料模型是否允許 immutable versions、diff、approval 與 rollback？
- 是否已有 Scheduler/Event Bus、Vault/KMS、Policy Engine 與 Eval framework？
- 部署是否能隔離 Authoring、Sandbox、Staging 與 Production？
